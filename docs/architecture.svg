<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="home-dc-architecture-title home-dc-architecture-desc">
  <title id="home-dc-architecture-title">Home DC architecture — repository ownership and live services</title>
  <desc id="home-dc-architecture-desc">Ansible configures standalone Proxmox host pve-00, OpenTofu provisions four app-cluster guests, and one app-cluster Argo CD manages both Kubernetes clusters. Longhorn stores app state; the infra cluster remains node-local. NAS holds shared media and Backrest backups. Internal DNS uses Technitium; optional public routes use Cloudflare tunnels.</desc>
  <style>
    :root { --fg:#2d3142; --muted:#4f5d75; --border:#bfc0c0; --surface:#f5f5f5; --accent:#bf4520; --c1:#2e5aa8; }
    @media (prefers-color-scheme:dark) { :root { --fg:#f5f5f5; --muted:#bfc0c0; --border:#737b8e; --surface:#252832; --accent:#f08a59; --c1:#86a8f5; } }
    text { font-family:system-ui,sans-serif; fill:var(--fg); }
    .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .eyebrow { font-size:11px; letter-spacing:1.8px; fill:var(--muted); }
    .title { font-size:27px; font-weight:650; }
    .subtitle { font-size:13px; fill:var(--muted); }
    .zone { font-size:10px; font-weight:600; letter-spacing:1.2px; fill:var(--muted); }
    .name { font-size:15px; font-weight:650; }
    .small { font-size:11px; fill:var(--muted); }
    .label { font-size:10px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="var(--muted)"/></marker>
    <marker id="arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="var(--c1)"/></marker>
  </defs>
  <text x="40" y="34" class="eyebrow mono">HOME DC · VERIFIED CURRENT TOPOLOGY</text>
  <text x="40" y="70" class="title">One host · two clusters · explicit ownership</text>
  <text x="40" y="96" class="subtitle">Argo CD runs on app-cluster and manages both clusters; infra-cluster remains physical and node-local.</text>

  <g fill="none" stroke="var(--border)" stroke-dasharray="4 4">
    <rect x="40" y="120" width="300" height="508" rx="8"/>
    <rect x="368" y="120" width="650" height="508" rx="8"/>
    <rect x="1046" y="120" width="354" height="508" rx="8"/>
  </g>
  <g class="zone mono">
    <rect x="52" y="124" width="180" height="18" fill="var(--surface)" stroke="none"/><text x="60" y="137">REPOSITORIES</text>
    <rect x="380" y="124" width="216" height="18" fill="var(--surface)" stroke="none"/><text x="388" y="137">HOST · GUESTS · APP CLUSTER</text>
    <rect x="1058" y="124" width="248" height="18" fill="var(--surface)" stroke="none"/><text x="1066" y="137">PHYSICAL INFRA · SHARED SERVICES</text>
  </g>

  <!-- Ownership, GitOps, and runtime service dependencies. -->
  <g fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 198 H392" stroke="var(--muted)" marker-end="url(#arrow-control)"/>
    <path d="M320 298 H392" stroke="var(--muted)" marker-end="url(#arrow-control)"/>
    <path d="M320 414 H668 V454" stroke="var(--muted)" marker-end="url(#arrow-control)"/>
    <path d="M520 230 V258" stroke="var(--muted)" marker-end="url(#arrow-control)"/>
    <path d="M704 398 V454" stroke="var(--muted)" marker-end="url(#arrow-control)"/>
    <path d="M908 510 H1080 V454" stroke="var(--muted)" marker-end="url(#arrow-control)"/>
    <path d="M908 536 H1072 V574" stroke="var(--muted)" marker-end="url(#arrow-control)"/>
    <path d="M888 326 H1000 V214 H1080" stroke="var(--c1)" marker-end="url(#arrow-data)"/>
    <path d="M888 350 H984 V574 H1080" stroke="var(--c1)" marker-end="url(#arrow-data)"/>
    <path d="M908 336 H960 V384 H1080" stroke="var(--c1)" marker-end="url(#arrow-data)"/>
    <path d="M908 558 H972 V618 H1080" stroke="var(--c1)" marker-end="url(#arrow-data)"/>
  </g>

  <!-- Repository ownership. -->
  <g stroke-width="1">
    <rect x="56" y="164" width="264" height="68" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="68" y="192" class="name">home-dc-proxmox</text><text x="68" y="214" class="small mono">Ansible · PVE host only</text>
    <rect x="56" y="264" width="264" height="68" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="68" y="292" class="name">home-dc-terraform</text><text x="68" y="314" class="small mono">OpenTofu · guests + Cloudflare</text>
    <rect x="56" y="380" width="264" height="68" rx="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="68" y="408" class="name">home-dc-kubernetes</text><text x="68" y="430" class="small mono">Talos · manifests · Argo CD GitOps</text>
    <rect x="56" y="496" width="264" height="68" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="68" y="524" class="name">home-dc</text><text x="68" y="546" class="small mono">Documentation only</text>
    <text x="56" y="602" class="small mono">home-kestra: separate, operator-initiated workflows;</text>
    <text x="56" y="618" class="small mono">not a current dependency of pve-00 or either cluster.</text>
  </g>

  <!-- Proxmox host and app-cluster runtime. -->
  <g stroke-width="1">
    <rect x="392" y="164" width="256" height="66" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="408" y="192" class="name">pve-00 · standalone PVE 9</text><text x="408" y="214" class="small mono">one physical host · no PVE HA/Ceph</text>
    <rect x="392" y="258" width="256" height="140" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="408" y="284" class="name">App-cluster Talos VMs</text>
    <text x="408" y="308" class="small mono">k8s-ctrl-01 · 1 controller</text>
    <text x="408" y="330" class="small mono">k8s-wrkr-01-gpu · GPU</text>
    <text x="408" y="352" class="small mono">k8s-wrkr-02 · worker</text>
    <text x="408" y="374" class="small mono">k8s-wrkr-03 · worker</text>
    <rect x="668" y="258" width="240" height="140" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="684" y="284" class="name">App-cluster services</text>
    <text x="684" y="308" class="small mono">Argo CD hub · both clusters</text>
    <text x="684" y="330" class="small mono">Longhorn · 3 replicas · longhorn</text>
    <text x="684" y="352" class="small mono">Doppler operator · apps config</text>
    <text x="684" y="374" class="small mono">envoy-internal · .102</text>
    <rect x="668" y="454" width="240" height="152" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="684" y="480" class="name">App-cluster persistent data</text>
    <text x="684" y="504" class="small mono">Longhorn: app config + state</text>
    <text x="684" y="526" class="small mono">NFS: media library + Backrest target</text>
    <text x="684" y="548" class="small mono">NAS target mounts at /backups</text>
    <text x="684" y="582" class="small mono">Immich originals: NAS /media</text>
  </g>

  <!-- Infra, shared services, and external edge. -->
  <g stroke-width="1">
    <rect x="1080" y="164" width="288" height="100" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="1096" y="190" class="name">Cloudflare · public opt-in</text>
    <text x="1096" y="214" class="small mono">krapulax.dev via Tunnel only</text>
    <text x="1096" y="238" class="small mono">tunnel → envoy-external</text>
    <rect x="1080" y="300" width="288" height="116" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="1096" y="326" class="name">NAS · 10.0.40.2</text>
    <text x="1096" y="350" class="small mono">/media · shared library + originals</text>
    <text x="1096" y="372" class="small mono">/k8s-backup · Backrest destination</text>
    <text x="1096" y="396" class="small mono">mounted by Backrest at /backups</text>
    <rect x="1080" y="454" width="288" height="126" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="1096" y="480" class="name">Infra-cluster · physical Talos</text>
    <text x="1096" y="504" class="small mono">infra-cp-01 + infra-wk-01</text>
    <text x="1096" y="526" class="small mono">app-cluster Argo CD manages it</text>
    <text x="1096" y="550" class="small mono">node-local hostPath / local-path</text>
    <text x="1096" y="570" class="small mono">infra Backrest · Doppler infra config</text>
    <rect x="1080" y="596" width="288" height="44" rx="6" fill="var(--surface)" stroke="var(--border)"/>
    <text x="1096" y="624" class="small mono">Technitium · ExternalDNS → .home</text>
  </g>

  <g class="label mono">
    <text x="332" y="188" textLength="58" lengthAdjust="spacingAndGlyphs">HOST</text>
    <text x="332" y="288" textLength="58" lengthAdjust="spacingAndGlyphs">GUESTS</text>
    <text x="480" y="406" textLength="140" lengthAdjust="spacingAndGlyphs">GITOPS SOURCE</text>
    <text x="724" y="438" textLength="86" lengthAdjust="spacingAndGlyphs">RECONCILES</text>
    <text x="936" y="502" textLength="76" lengthAdjust="spacingAndGlyphs">MANAGES</text>
    <text x="930" y="331" textLength="100" lengthAdjust="spacingAndGlyphs">PUBLIC TUNNEL</text>
    <text x="930" y="382" textLength="100" lengthAdjust="spacingAndGlyphs">SHARED MEDIA</text>
    <text x="930" y="468" textLength="100" lengthAdjust="spacingAndGlyphs">NFS BACKUP</text>
    <text x="930" y="590" textLength="88" lengthAdjust="spacingAndGlyphs">RFC2136 DNS</text>
  </g>
  <g class="small mono">
    <path d="M56 700 H104" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow-control)"/><text x="120" y="704">OWNERSHIP / CONTROL</text>
    <path d="M360 700 H408" stroke="var(--c1)" stroke-width="1.4" marker-end="url(#arrow-data)"/><text x="424" y="704">DATA / SERVICE DEPENDENCY</text>
    <text x="880" y="704">Status verified 2026-11-11 · no restore test performed</text>
  </g>
</svg>
