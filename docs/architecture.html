<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home DC architecture — ownership and runtime</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --fg: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --border: rgba(45, 49, 66, 0.20);
      --surface: #f5f5f5;
      --accent: #bf4520;
      --accent-tint: rgba(191, 69, 32, 0.08);
      --link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      margin: 0;
      padding: 40px 0 24px;
      color: var(--fg);
      font-family: var(--font-sans);
    }
    .frame { max-width: 1280px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 8px/1.4 var(--font-mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      font: 400 28px/1.15 var(--font-serif);
      letter-spacing: -0.02em;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; }
    @media print {
      body { padding: 12px; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Home DC · current ownership</p>
    <h1>One host, two clusters, clear ownership</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="home-dc-architecture-title home-dc-architecture-desc">
        <title id="home-dc-architecture-title">Home DC architecture</title>
        <desc id="home-dc-architecture-desc">Three repositories own PVE host configuration, guest provisioning, and Kubernetes GitOps; one Proxmox host runs the app-cluster guests, while Cloudflare and LAN services connect to the app and physical infrastructure clusters.</desc>
        <defs>
          <marker id="home-dc-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
          <marker id="home-dc-arrow-traffic" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
        </defs>

        <!-- Three flat zones: repositories, the PVE/Talos runtime, and edge/physical infrastructure. -->
        <g fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4">
          <rect x="40" y="120" width="292" height="496" rx="8"/>
          <rect x="360" y="120" width="600" height="496" rx="8"/>
          <rect x="984" y="120" width="256" height="496" rx="8"/>
        </g>
        <g font-family="var(--font-mono)" font-size="8" font-weight="500" letter-spacing="0.14em" fill="var(--soft)">
          <rect x="52" y="124" width="140" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="60" y="136">REPOSITORY OWNERSHIP</text>
          <rect x="372" y="124" width="156" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="380" y="136">PROXMOX + TALOS RUNTIME</text>
          <rect x="996" y="124" width="164" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="1004" y="136">EDGE + PHYSICAL CLUSTER</text>
        </g>

        <!-- Ownership, host, and service relationships. Draw paths before nodes. -->
        <g fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M316 208 H384" stroke="var(--muted)" marker-end="url(#home-dc-arrow-control)"/>
          <path d="M316 352 H384" stroke="var(--muted)" marker-end="url(#home-dc-arrow-control)"/>
          <path d="M316 524 H680" stroke="var(--muted)" marker-end="url(#home-dc-arrow-control)"/>
          <path d="M508 252 V300" stroke="var(--muted)" marker-end="url(#home-dc-arrow-control)"/>
          <path d="M632 352 H656 V440 H760 V472" stroke="var(--muted)" marker-end="url(#home-dc-arrow-control)"/>
          <path d="M936 552 H1008" stroke="var(--muted)" marker-end="url(#home-dc-arrow-control)"/>
          <path d="M1216 216 H1228 V440 H900 V472" stroke="var(--link)" marker-end="url(#home-dc-arrow-traffic)"/>
          <path d="M1216 240 H1244 V524 H1216" stroke="var(--link)" marker-end="url(#home-dc-arrow-traffic)"/>
          <path d="M1008 352 H840 V472" stroke="var(--link)" marker-end="url(#home-dc-arrow-traffic)"/>
        </g>

        <!-- Connector labels use opaque paper masks with an 8px gap from their strokes. -->
        <g font-family="var(--font-mono)" font-size="8" font-weight="400" letter-spacing="0.06em" fill="var(--muted)" text-anchor="middle">
          <rect x="320" y="184" width="60" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="350" y="196">HOST ONLY</text>
          <rect x="328" y="328" width="44" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="350" y="340">GUESTS</text>
          <rect x="432" y="500" width="128" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="496" y="512">TALOS + GITOPS</text>
          <rect x="1136" y="416" width="84" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="1178" y="428">APP TUNNEL</text>
          <rect x="1152" y="448" width="84" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="1194" y="460">INFRA TUNNEL</text>
          <rect x="848" y="416" width="56" height="16" rx="2" fill="var(--surface)" stroke="none"/>
          <text x="876" y="428">LAN DATA</text>
        </g>

        <!-- Repository nodes. -->
        <g stroke-width="1">
          <rect x="56" y="164" width="260" height="88" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="68" y="176" width="68" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="102" y="188" text-anchor="middle" class="tag">ANSIBLE</text>
          <text x="68" y="216" class="node-name">home-dc-proxmox</text>
          <text x="68" y="236" class="sublabel">PVE host configuration only</text>

          <rect x="56" y="300" width="260" height="104" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
          <rect x="68" y="312" width="76" height="16" rx="2" fill="none" stroke="var(--accent)"/>
          <text x="106" y="324" text-anchor="middle" class="tag" fill="var(--accent)">OPENTOFU</text>
          <text x="68" y="352" class="node-name">home-dc-terraform</text>
          <text x="68" y="372" class="sublabel">Proxmox guests · Cloudflare</text>
          <text x="68" y="390" class="sublabel">two independent roots</text>

          <rect x="56" y="472" width="260" height="104" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="68" y="484" width="56" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="96" y="496" text-anchor="middle" class="tag">GITOPS</text>
          <text x="68" y="524" class="node-name">home-dc-kubernetes</text>
          <text x="68" y="544" class="sublabel">Talos · bootstrap · GitOps</text>
          <text x="68" y="562" class="sublabel">Argo CD source on main</text>
        </g>

        <!-- Runtime and shared-service nodes. -->
        <g stroke-width="1">
          <rect x="384" y="164" width="248" height="88" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="396" y="176" width="72" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="432" y="188" text-anchor="middle" class="tag">COMPUTE</text>
          <text x="396" y="216" class="node-name">pve-00 · Proxmox VE 9</text>
          <text x="396" y="236" class="sublabel">single host · no HA/Ceph</text>

          <rect x="384" y="300" width="248" height="104" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="396" y="312" width="56" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="424" y="324" text-anchor="middle" class="tag">GUESTS</text>
          <text x="396" y="352" class="node-name">PVE guests</text>
          <text x="396" y="372" class="sublabel">1 controller · 3 worker VMs</text>
          <text x="396" y="390" class="sublabel">PBS target LXC · smoke LXC</text>

          <rect x="680" y="472" width="256" height="136" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="692" y="484" width="88" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="736" y="496" text-anchor="middle" class="tag">TALOS · APP</text>
          <text x="692" y="524" class="node-name">app-cluster</text>
          <text x="692" y="544" class="sublabel">1 controller + 3 workers</text>
          <text x="692" y="562" class="sublabel">Argo CD hub · API VIP .101</text>
          <text x="692" y="580" class="sublabel">worker-local PVCs + NAS media</text>

          <rect x="1008" y="472" width="208" height="104" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="1020" y="484" width="96" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="1068" y="496" text-anchor="middle" class="tag">TALOS · INFRA</text>
          <text x="1020" y="524" class="node-name">infra-cluster</text>
          <text x="1020" y="544" class="sublabel">2 physical Talos nodes</text>
          <text x="1020" y="562" class="sublabel">managed by app-cluster Argo</text>

          <rect x="1008" y="164" width="208" height="104" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="1020" y="176" width="128" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="1084" y="188" text-anchor="middle" class="tag">TF · TUNNELS / ACCESS</text>
          <text x="1020" y="216" class="node-name">Cloudflare</text>
          <text x="1020" y="236" class="sublabel">public DNS · app/infra tunnels</text>
          <text x="1020" y="252" class="sublabel">Access policies</text>

          <rect x="1008" y="300" width="208" height="104" rx="6" fill="var(--surface)" stroke="var(--border)"/>
          <rect x="1020" y="312" width="40" height="16" rx="2" fill="none" stroke="var(--border)"/>
          <text x="1040" y="324" text-anchor="middle" class="tag">LAN</text>
          <text x="1020" y="352" class="node-name">Technitium + NAS</text>
          <text x="1020" y="372" class="sublabel">DNS .53 · media/NFS .2</text>
          <text x="1020" y="390" class="sublabel">local DNS · storage</text>
        </g>

        <style>
          .tag { font: 500 8px var(--font-mono); letter-spacing: 0.10em; fill: var(--muted); }
          .node-name { font: 600 12px var(--font-sans); fill: var(--fg); }
          .sublabel { font: 400 9px var(--font-mono); fill: var(--soft); }
        </style>

        <!-- Horizontal legend strip. -->
        <g font-family="var(--font-mono)" font-size="9" fill="var(--muted)">
          <path d="M56 680 H112" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#home-dc-arrow-control)"/>
          <text x="128" y="684">OWNERSHIP / CONTROL</text>
          <path d="M424 680 H480" stroke="var(--link)" stroke-width="1.2" marker-end="url(#home-dc-arrow-traffic)"/>
          <text x="496" y="684">TRAFFIC / SERVICE DEPENDENCY</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
